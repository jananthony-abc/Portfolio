<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Arial,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8390a5"/></marker></defs><rect width="1600" height="940" fill="#f7f9fc"/><text x="60" y="65" font-size="38" fill="#172033">Discovery email → engagement tracking</text><text x="60" y="105" font-size="21" fill="#60718c">AURA 360  /  Four connected workflows  /  Reconstructed overview</text><rect x="40" y="140" width="1520" height="164" rx="16" fill="white" stroke="#d9e0ea"/><text x="65" y="174" font-size="19" fill="#345cc4">01  INITIAL EMAIL</text><rect x="65" y="191" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="83" y="225" font-size="23" fill="#172033">Manual enrollment</text><path d="M516 218H550" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="191" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="578" y="225" font-size="23" fill="#172033">Drip → send email</text><path d="M1011 218H1045" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="1055" y="191" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="1073" y="225" font-size="23" fill="#172033">Update contact field</text><text x="65" y="281" font-size="20" fill="#60718c">Selected contacts receive the discovery email.</text><rect x="40" y="320" width="1520" height="164" rx="16" fill="white" stroke="#d9e0ea"/><text x="65" y="354" font-size="19" fill="#345cc4">02  LINK CLICKED</text><rect x="65" y="371" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="83" y="405" font-size="23" fill="#172033">Trigger link clicked</text><path d="M516 398H550" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="371" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="578" y="405" font-size="23" fill="#172033">Check campaign status</text><path d="M1011 398H1045" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="1055" y="371" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="1073" y="405" font-size="23" fill="#172033">Otherwise: update field</text><text x="65" y="461" font-size="20" fill="#60718c">The visible matching branch exits; the other branch records engagement.</text><rect x="40" y="500" width="1520" height="164" rx="16" fill="white" stroke="#d9e0ea"/><text x="65" y="534" font-size="19" fill="#345cc4">03  CUSTOMER REPLIED</text><rect x="65" y="551" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="83" y="585" font-size="23" fill="#172033">Customer replied</text><path d="M516 578H550" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="551" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="578" y="585" font-size="23" fill="#172033">Already demo booked?</text><path d="M1011 578H1045" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="1055" y="551" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="1073" y="585" font-size="23" fill="#172033">Otherwise: update field</text><text x="65" y="641" font-size="20" fill="#60718c">Booked contacts exit this path, preserving their later campaign status.</text><rect x="40" y="680" width="1520" height="164" rx="16" fill="white" stroke="#d9e0ea"/><text x="65" y="714" font-size="19" fill="#345cc4">04  DEMO BOOKED</text><rect x="65" y="731" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="83" y="765" font-size="23" fill="#172033">Appointment booked</text><path d="M516 758H550" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="731" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="578" y="765" font-size="23" fill="#172033">Wait → check status</text><path d="M1011 758H1045" stroke="#8390a5" stroke-width="2" marker-end="url(#a)"/><rect x="1055" y="731" width="450" height="55" rx="10" fill="#f1f5fc" stroke="#d5dfef"/><text x="1073" y="765" font-size="23" fill="#172033">Match: update field</text><text x="65" y="821" font-size="20" fill="#60718c">The matching branch updates the contact; the unmatched branch exits.</text><text x="60" y="905" font-size="19" fill="#60718c">Simplified for presentation. Original captures document the visible conditions and actions.</text></svg>